syntax = "proto3";

package text_storage;

option go_package = "github.com/Aleveins/book-emotions-analyzer/pkg/pb/text_storage";

service TextStorageService {
  rpc SaveText(SaveTextRequest) returns (SaveTextResponse);
  rpc GetText(GetTextRequest) returns (GetTextResponse);
  rpc ListTexts(ListTextsRequest) returns (ListTextsResponse);
  rpc DeleteText(DeleteTextRequest) returns (DeleteTextResponse);
  rpc SaveAnalysisResult(SaveAnalysisResultRequest) returns (SaveAnalysisResultResponse);
  rpc GetAnalysisResult(GetAnalysisResultRequest) returns (GetAnalysisResultResponse);
}

message SaveTextRequest {
  string user_id = 1;
  string title = 2;
  string filename = 3;
  bytes content = 4;
  string format = 5; // txt | pdf
}

message SaveTextResponse {
  string text_id = 1;
}

message GetTextRequest {
  string text_id = 1;
}

message GetTextResponse {
  Text text = 1;
}

message ListTextsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListTextsResponse {
  repeated Text texts = 1;
  int32 total = 2;
}

message DeleteTextRequest {
  string text_id = 1;
}

message DeleteTextResponse {}

message Text {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string filename = 4;
  bytes content = 5;
  string format = 6;
  string created_at = 7;
}

// Хранение result_json в байтах позволяет менять формат результата без постоянных изменений контракта и схемы бд
message SaveAnalysisResultRequest {
  string text_id = 1;
  string job_id = 2;
  bytes result_json = 3;
}

message SaveAnalysisResultResponse {
  string result_id = 1;
}

message GetAnalysisResultRequest {
  string job_id = 1;
}

message GetAnalysisResultResponse {
  string id = 1;
  string text_id = 2;
  string job_id = 3;
  bytes result_json = 4;
  string created_at = 5;
}
