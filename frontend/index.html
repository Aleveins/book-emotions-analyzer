<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эмоциональный анализ текстов</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
  <header>
    <h1>📖 Эмоциональный анализ художественных текстов 📖</h1>
    <div id="user-bar" class="hidden">
      <span id="user-login"></span>
      <button id="logout-btn" class="btn-secondary">Выйти</button>
    </div>
  </header>

  <main>
    <section id="auth-view" class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Логин<input type="text" name="login" autocomplete="username" minlength="3" maxlength="64"
            required></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn-primary">Войти</button>
        <div class="form-error"></div>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Логин<input type="text" name="login" autocomplete="username" minlength="3" maxlength="64"
            required></label>
        <label>Пароль<input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
        <div class="form-error"></div>
      </form>
    </section>

    <section id="main-view" class="hidden">
      <div class="grid">
        <div class="card">
          <h2>Новая задача</h2>
          <form id="upload-form">
            <label>Название произведения<input type="text" name="title" required></label>
            <label>Файл книги (.txt, .pdf)
              <input type="file" name="file" accept=".txt,.pdf" required>
            </label>
            <label class="checkbox" id="use-llm-label">
              <input type="checkbox" name="use_llm">
              <span>Использовать дополнительную LLM для анализа сцен (может сильно увеличить время обработки
                текста)</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" name="use_paragraph_analysis">
              <span>Включить анализ эмоций по логическим блокам (рекомендуется для небольших рассказов без глав)</span>
            </label>
            <button type="submit" class="btn-primary">Отправить на анализ</button>
            <div class="form-error"></div>
          </form>
        </div>

        <div class="card">
          <div class="row-between">
            <h2>Мои задачи</h2>
            <button id="refresh-jobs" class="btn-secondary">Обновить</button>
          </div>
          <div id="jobs-list" class="jobs-list"></div>
        </div>
      </div>

      <div id="result-view" class="card hidden">
        <div class="row-between">
          <h2 id="result-title">Результаты анализа</h2>
          <button id="close-result" class="btn-secondary">Закрыть</button>
        </div>
        <div class="charts">
          <div class="chart-box">
            <h3>Топ эмоций произведения</h3>
            <canvas id="book-emotions-chart"></canvas>
          </div>
          <div class="chart-box">
            <h3>Эмоциональная динамика по главам</h3>
            <canvas id="timeline-chart"></canvas>
          </div>
        </div>
        <h3>Главы</h3>
        <div id="chapters-list" class="chapters-list"></div>
        <div id="blocks-section" class="hidden">
          <h3>Логические блоки</h3>
          <div class="chart-box block-chart-box">
            <canvas id="block-timeline-chart"></canvas>
          </div>
          <div id="blocks-list" class="blocks-list"></div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="/app.js"></script>
</body>

</html>
